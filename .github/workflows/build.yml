name: build-arch

# CI shakeout build (unversioned artifact). Releases are release.yml's job — it rebuilds with
# the real version baked in and publishes to a GitHub release.
on:
  workflow_dispatch:        # run on demand (build a new image when we want one)
    inputs:
      app_ref:
        description: 'drdro-software-f4 ref to bake (blank = per branch: main -> newest stable tag, dev -> app dev branch)'
        required: false
        default: ''
  push:
    branches: [main, dev]
    paths: ['build.sh', 'packages.txt', 'overlay/**', 'boot/**', '.github/workflows/build.yml']

concurrency:
  group: arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arch linux arm rpi (aarch64, native)
    runs-on: ubuntu-24.04-arm   # native ARM64 → the ALARM chroot runs without qemu
    timeout-minutes: 90
    env:
      WORK: /mnt/arch/work      # build on the big ephemeral /mnt volume, not the small root disk
      OUT: /mnt/arch/out
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + prep /mnt scratch
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet || true
          sudo mkdir -p /mnt/arch && sudo chown -R "$USER" /mnt/arch
          df -h / /mnt

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools dosfstools mtools e2fsprogs util-linux git curl zstd

      - name: Build image
        # build.sh derives the app ref from the branch (main -> newest stable app tag, dev -> app
        # dev branch) unless app_ref is given. The runner checkout is detached, so pass the branch
        # explicitly rather than letting build.sh read it from the checkout.
        run: |
          sudo WORK="$WORK" OUT="$OUT" \
               BUILD_BRANCH="${{ github.ref_name }}" APP_REF="${{ inputs.app_ref }}" ./build.sh

      - name: Upload image
        # No manual zstd: upload-artifact always zips. Upload the raw .img and let the zip compress
        # it (the image is root-owned but world-readable, so the non-sudo upload can read it).
        # Download unzips straight to a flashable .img.
        uses: actions/upload-artifact@v4
        with:
          name: drdro-arch-rpi-aarch64
          path: /mnt/arch/out/drdro-arch-rpi-aarch64.img
          if-no-files-found: error
          compression-level: 9
